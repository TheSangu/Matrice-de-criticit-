/* Studio — éditeur de la matrice. Interface volontairement distincte de l'outil
 * public : le mainteneur doit voir d'un coup d'œil qu'il est « en coulisses ». */

:root {
  --primary: #00875a;
  --primary-dark: #006b47;
  --ink: #1f2a30;
  --text: #2c3a42;
  --muted: #5c6b73;
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f9f7;
  --border: #d9e2dc;
  --border-strong: #c2cfc7;
  --danger: #b4232a;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0, 40, 25, 0.10);
  --shadow-lg: 0 8px 28px rgba(0, 40, 25, 0.16);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}

/* ---------- Barre d'outils ---------- */
.studio-bar { background: var(--ink); color: #fff; position: relative; z-index: 20; box-shadow: var(--shadow); }
.studio-bar-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 0.55rem 1rem; flex-wrap: wrap;
}
.studio-brand { display: inline-flex; align-items: center; gap: 0.6rem; font-weight: 700; }
.studio-brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px; background: var(--primary); font-size: 1rem;
}
.studio-brand-text { display: inline-flex; flex-direction: column; line-height: 1.1; font-size: 1.02rem; }
.studio-brand-sub { font-size: 0.72rem; font-weight: 500; color: #9fb4ab; }

.studio-actions { display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.statut { font-size: 0.8rem; color: #a7d8c4; min-width: 6ch; }
.statut.saving { color: #ffd27a; }

.btn {
  font: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer;
  border-radius: 8px; padding: 0.44rem 0.8rem; border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #00996a; }
.btn-ghost { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.18); }
.btn-ghost:hover { background: rgba(255,255,255,0.16); }
.btn-danger { color: #ffb3b3; }
.btn-danger:hover { background: rgba(180,35,42,0.25); }
.btn:focus-visible { outline: 3px solid #7fd8b6; outline-offset: 2px; }

.menu-publier {
  position: absolute; right: 1rem; top: calc(100% - 4px);
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 0.35rem; min-width: 320px; z-index: 30;
}
.menu-publier[hidden] { display: none; }
.menu-publier button {
  display: block; width: 100%; text-align: left; background: none; border: none; font: inherit;
  padding: 0.55rem 0.7rem; border-radius: 8px; cursor: pointer; color: var(--text);
}
.menu-publier button:hover { background: var(--surface-2); }

/* ---------- Disposition principale ---------- */
.studio-main {
  flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0; min-height: 0;
}
.studio-edit { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--border); }
.studio-preview { display: flex; flex-direction: column; min-height: 0; background: var(--surface-2); }

/* ---------- Onglets ---------- */
.studio-tabs {
  display: flex; gap: 0.15rem; padding: 0.5rem 0.6rem 0; border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-wrap: wrap;
}
.tab {
  font: inherit; font-size: 0.84rem; font-weight: 600; color: var(--muted); cursor: pointer;
  background: none; border: 1px solid transparent; border-bottom: none;
  padding: 0.5rem 0.75rem; border-radius: 8px 8px 0 0; white-space: nowrap;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab.actif { color: var(--primary-dark); background: var(--surface); border-color: var(--border); border-bottom: 2px solid var(--primary); }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

.studio-panels { flex: 1; overflow-y: auto; padding: 1.1rem 1.1rem 3rem; }
.panel-loading { color: var(--muted); padding: 2rem 0; text-align: center; }

/* ---------- Formulaires ---------- */
.panel-titre { margin: 0 0 0.2rem; font-size: 1.12rem; color: var(--ink); }
.panel-intro { margin: 0 0 1.1rem; color: var(--muted); font-size: 0.88rem; }

.champ { margin-bottom: 0.9rem; }
.champ > label, .champ-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink); margin-bottom: 0.28rem; }
.champ .aide { font-weight: 400; color: var(--muted); font-size: 0.78rem; }
.champ input[type="text"], .champ input[type="url"], .champ textarea, .champ select {
  width: 100%; font: inherit; font-size: 0.9rem; color: var(--text);
  padding: 0.5rem 0.6rem; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff;
}
.champ textarea { resize: vertical; min-height: 3.2rem; }
.champ input:focus, .champ textarea:focus, .champ select:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
.champ-inline { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.champ-inline > .champ { flex: 1; min-width: 140px; margin-bottom: 0; }

.champ input[type="color"] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; cursor: pointer; vertical-align: middle; }

/* Cartes de liste (signaux, contexte, ressources, affiches…) */
.liste-carte {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2);
  padding: 0.8rem 0.85rem; margin-bottom: 0.7rem; position: relative;
}
.liste-carte-tete { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
.liste-carte-tete .poignee { color: var(--muted); font-size: 0.95rem; }
.liste-carte-num { font-size: 0.75rem; font-weight: 700; color: var(--muted); background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 0.05rem 0.5rem; }
.liste-carte-titre { font-weight: 600; font-size: 0.9rem; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-actions { display: inline-flex; gap: 0.2rem; }
.mini-btn {
  font: inherit; font-size: 0.8rem; cursor: pointer; background: #fff; color: var(--muted);
  border: 1px solid var(--border-strong); border-radius: 7px; width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
}
.mini-btn:hover { color: var(--ink); border-color: var(--muted); }
.mini-btn.suppr:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
.mini-btn:disabled { opacity: 0.35; cursor: default; }

.btn-ajouter {
  font: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; color: var(--primary-dark);
  background: #fff; border: 1px dashed var(--border-strong); border-radius: 9px;
  padding: 0.6rem 0.9rem; width: 100%; margin-top: 0.3rem;
}
.btn-ajouter:hover { border-color: var(--primary); background: var(--surface-2); }

.pill-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.pill-check {
  display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text);
  background: #fff; border: 1px solid var(--border-strong); border-radius: 999px; padding: 0.25rem 0.6rem; cursor: pointer;
}
.pill-check input { margin: 0; }
.pill-check.on { border-color: var(--primary); background: var(--accent-soft, #e7faf0); color: var(--primary-dark); font-weight: 600; }

.sous-section { margin: 1.4rem 0 0.7rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.95rem; font-weight: 700; color: var(--ink); }
.note-info { font-size: 0.8rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 8px; padding: 0.55rem 0.7rem; margin: 0.4rem 0 0.9rem; }
.verrou { font-size: 0.72rem; color: var(--muted); }

/* Import de document (affiches) */
.doc-attache { display: flex; align-items: baseline; gap: 0.5rem; background: var(--accent-soft, #e7faf0); border: 1px solid #bfe8d3; border-radius: 8px; padding: 0.5rem 0.65rem; margin-bottom: 0.5rem; }
.doc-nom { font-weight: 600; font-size: 0.88rem; color: var(--primary-dark); word-break: break-all; }
.doc-taille { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.doc-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
.btn-import { font-size: 0.84rem; font-weight: 600; cursor: pointer; color: var(--primary-dark); background: #fff; border: 1px solid var(--primary); border-radius: 8px; padding: 0.42rem 0.75rem; display: inline-flex; align-items: center; }
.btn-import:hover { background: var(--surface-2); }
.btn-import:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn-doc-retirer { font: inherit; font-size: 0.82rem; cursor: pointer; color: var(--muted); background: none; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0.42rem 0.7rem; }
.btn-doc-retirer:hover { color: #fff; background: var(--danger); border-color: var(--danger); }

/* ---------- Prévisualisation ---------- */
.preview-head { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.55rem 0.9rem; border-bottom: 1px solid var(--border); background: var(--surface); }
.preview-titre { font-weight: 700; font-size: 0.9rem; color: var(--ink); }
.preview-hint { font-size: 0.78rem; color: var(--muted); }
.preview-frame-wrap { flex: 1; min-height: 0; padding: 0.8rem; }
.preview-frame { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .studio-main { grid-template-columns: 1fr; }
  .studio-edit { border-right: none; border-bottom: 1px solid var(--border); }
  .studio-preview { min-height: 60vh; }
  .menu-publier { min-width: 260px; }
}

</style>
</head>
<body>
  <!-- Barre d'outils -->

        <button class="tab" type="button" data-tab="signaux">Signaux</button>
        <button class="tab" type="button" data-tab="contexte">Contexte</button>
        <button class="tab" type="button" data-tab="niveaux">Niveaux</button>
        <button class="tab" type="button" data-tab="ressources">Ressources</button>

      <div class="preview-frame-wrap">
        <iframe id="preview" title="Aperçu de la matrice" class="preview-frame"></iframe>
      </div>
    </section>
  </main>

  <script>window.__STUDIO_EMBED__ = {"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"fr\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  \u003ctitle>Matrice de criticité — Aide au manager\u003c/title>\n  \u003cmeta name=\"description\" content=\"Aide au manager en cas d'inquiétude pour un collaborateur. Aucune donnée n'est enregistrée.\" />\n  \u003clink rel=\"icon\" href=\"assets/logo.png\" />\n  \u003clink rel=\"stylesheet\" href=\"assets/style.css\" />\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"brand-bar\">\n    \u003cdiv class=\"wrap\">\n      \u003ca class=\"brand\" href=\".\" aria-label=\"Groupama d'Oc\">\n        \u003cimg src=\"assets/logo.png\" alt=\"Groupama d'Oc\" class=\"brand-logo\"\n             onerror=\"this.remove(); document.getElementById('brand-fallback').hidden = false;\" />\n        \u003cspan id=\"brand-fallback\" class=\"brand-wordmark\" hidden>\n          \u003cspan class=\"bw-mark\" aria-hidden=\"true\">G\u003c/span>\n          \u003cspan class=\"bw-text\">Groupama\u003cspan class=\"bw-doc\">d'Oc\u003c/span>\u003c/span>\n        \u003c/span>\n      \u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"title-band\">\n    \u003cdiv class=\"wrap title-inner\">\n      \u003cdiv>\n        \u003ch1 id=\"app-titre\">Matrice de criticité\u003c/h1>\n        \u003cp id=\"app-sous-titre\" class=\"sous-titre\">\u003c/p>\n      \u003c/div>\n      \u003col class=\"steps\" id=\"steps\" aria-hidden=\"true\">\n        \u003cli data-step=\"1\">Signaux\u003c/li>\n        \u003cli data-step=\"2\">Contexte\u003c/li>\n        \u003cli data-step=\"3\">Résultat\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cmain class=\"wrap app\" id=\"app\">\n\n    \u003c!-- Étape 0 : Accueil -->\n    \u003csection class=\"step\" id=\"step-accueil\" aria-labelledby=\"accueil-h\">\n      \u003ch2 id=\"accueil-h\">À quoi sert cet outil&nbsp;?\u003c/h2>\n      \u003cp id=\"accueil-intro\" class=\"intro\">\u003c/p>\n      \u003cul id=\"accueil-points\" class=\"points\">\u003c/ul>\n    \u003c/section>\n\n    \u003c!-- Étape 1 : Signaux -->\n    \u003csection class=\"step\" id=\"step-signaux\" hidden aria-labelledby=\"signaux-h\">\n      \u003cdiv class=\"step-head\">\n        \u003ch2 id=\"signaux-h\">Que constatez-vous&nbsp;?\u003c/h2>\n        \u003cp class=\"step-sub\">Cochez les signaux que vous observez. \u003cspan id=\"legende\" class=\"legende\">\u003c/span>\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"grille-signaux\" class=\"grille-familles\">\u003c/div>\n    \u003c/section>\n\n    \u003c!-- Étape 2 : Contexte -->\n    \u003csection class=\"step\" id=\"step-contexte\" hidden aria-labelledby=\"contexte-h\">\n      \u003cdiv class=\"step-head\">\n        \u003ch2 id=\"contexte-h\">Un élément du contexte de travail est-il en jeu&nbsp;?\u003c/h2>\n        \u003cp class=\"step-sub\">Facultatif. Le contexte n'augmente pas le niveau : il éclaire les causes et donne des leviers d'action.\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"grille-contexte\" class=\"chips\">\u003c/div>\n    \u003c/section>\n\n    \u003c!-- Étape 3 : Résultat -->\n    \u003csection class=\"step\" id=\"step-resultat\" hidden aria-labelledby=\"resultat-h\">\n      \u003ch2 id=\"resultat-h\" class=\"sr-only\">Résultat\u003c/h2>\n      \u003cdiv id=\"bandeau-niveau\" class=\"bandeau-niveau\" role=\"status\">\u003c/div>\n      \u003cp id=\"lecture\" class=\"lecture\">\u003c/p>\n\n      \u003cdiv class=\"resultat-cols\">\n        \u003cdiv class=\"col-actions\">\n          \u003cdiv class=\"carte\">\n            \u003ch3>À faire maintenant\u003c/h3>\n            \u003col id=\"demarche\" class=\"demarche\">\u003c/ol>\n          \u003c/div>\n          \u003cdiv class=\"carte carte-eviter\">\n            \u003ch3>À éviter\u003c/h3>\n            \u003cul id=\"a-eviter\" class=\"liste-puces\">\u003c/ul>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-orientation\">\n          \u003cdiv class=\"carte\">\n            \u003ch3>Posture\u003c/h3>\n            \u003cp id=\"posture\" class=\"posture\">\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"carte\">\n            \u003ch3>Vers qui orienter\u003c/h3>\n            \u003cul id=\"ressources\" class=\"ressources\">\u003c/ul>\n            \u003cp id=\"appui-note\" class=\"appui-note\">\u003c/p>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"carte bloc-detail\">\n        \u003ch3>Ce que vous avez coché, point par point\u003c/h3>\n        \u003cdiv id=\"detail-contenu\" class=\"detail-contenu\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"carte bloc-ressources\" id=\"ressources-utiles\" hidden>\n        \u003ch3 id=\"ressources-utiles-titre\">Ressources utiles\u003c/h3>\n        \u003cp id=\"ressources-utiles-intro\" class=\"affichages-intro\">\u003c/p>\n        \u003cul id=\"ressources-utiles-liste\" class=\"ressources\">\u003c/ul>\n      \u003c/div>\n\n      \u003cdiv class=\"carte bloc-coms\" id=\"affichages\" hidden>\n        \u003ch3 id=\"affichages-titre\">Communications à diffuser\u003c/h3>\n        \u003cp id=\"affichages-intro\" class=\"affichages-intro\">\u003c/p>\n        \u003cdiv id=\"affichages-themes\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- Navigation -->\n    \u003cnav class=\"nav\" id=\"nav\">\n      \u003cbutton id=\"btn-retour\" class=\"btn btn-ghost\" type=\"button\" hidden>← Retour\u003c/button>\n      \u003cspan class=\"nav-spacer\">\u003c/span>\n      \u003cbutton id=\"btn-suivant\" class=\"btn btn-primary\" type=\"button\">Commencer\u003c/button>\n    \u003c/nav>\n\n    \u003cp id=\"prudence\" class=\"prudence\" role=\"note\">\u003c/p>\n  \u003c/main>\n\n  \u003cfooter class=\"site-footer\">\n    \u003cdiv class=\"wrap\">\n      \u003cp>Aucune donnée saisie n'est enregistrée ni transmise — tout reste sur votre écran.\u003c/p>\n    \u003c/div>\n  \u003c/footer>\n\n  \u003cscript src=\"assets/app.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n","css":":root {\n  /* Charte Groupama d'Oc */\n  --primary: #00875a;\n  --primary-dark: #006b47;\n  --accent: #2bd96b;\n  --accent-soft: #e7faf0;\n\n  --bg: #f4f7f5;\n  --surface: #ffffff;\n  --text: #2c3a42;\n  --muted: #586a72;\n  --border: #e1e8e3;\n  --focus: #00875a;\n\n  --radius: 14px;\n  --shadow: 0 1px 3px rgba(0, 50, 30, 0.08);\n  --maxw: 980px;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body { height: 100%; }\nbody {\n  margin: 0;\n  display: flex;\n  flex-direction: column;\n  min-height: 100%;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  color: var(--text);\n  background: var(--bg);\n  line-height: 1.5;\n}\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.1rem; width: 100%; }\n.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n/* ---------- Marque ---------- */\n.brand-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 0.7rem 0; }\n.brand { display: inline-flex; align-items: center; text-decoration: none; }\n.brand-logo { height: 40px; width: auto; display: block; }\n.brand-wordmark { display: inline-flex; align-items: center; gap: 0.55rem; }\n.brand-wordmark[hidden] { display: none; }\n.brand-wordmark .bw-mark { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; font-size: 1.3rem; }\n.brand-wordmark .bw-text { display: inline-flex; flex-direction: column; line-height: 1; font-weight: 800; font-size: 1.4rem; color: var(--primary); }\n.brand-wordmark .bw-doc { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.18em; color: var(--text); text-transform: uppercase; margin-top: 0.16rem; }\n\n/* ---------- Bandeau titre + fil d'étapes ---------- */\n.title-band { background: var(--primary); color: #fff; padding: 0.9rem 0; }\n.title-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }\n.title-band h1 { margin: 0; font-size: 1.3rem; letter-spacing: -0.01em; }\n.title-band .sous-titre { margin: 0.15rem 0 0; opacity: 0.92; font-size: 0.9rem; }\n\n.steps { list-style: none; display: flex; gap: 0.4rem; margin: 0; padding: 0; counter-reset: s; }\n.steps li { counter-increment: s; font-size: 0.82rem; color: rgba(255,255,255,0.75); display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.5rem; border-radius: 999px; }\n.steps li::before { content: counter(s); display: inline-flex; align-items: center; justify-content: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: rgba(255,255,255,0.2); font-weight: 700; font-size: 0.78rem; }\n.steps li.actif { color: #fff; background: rgba(255,255,255,0.15); }\n.steps li.actif::before { background: #fff; color: var(--primary); }\n.steps li.fait::before { content: \"✓\"; background: var(--accent); color: var(--primary-dark); }\n\n/* ---------- Conteneur principal ---------- */\n.app { flex: 1; padding: 1.3rem 1.1rem 1.6rem; display: flex; flex-direction: column; }\n.step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.2rem 1.3rem 1.4rem; }\n.step h2 { margin: 0 0 0.6rem; font-size: 1.2rem; }\n.step-head { margin-bottom: 0.8rem; }\n.step-sub, .mini-titre { color: var(--muted); margin: 0; }\n.mini-titre { font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }\n.mini-titre .opt, .opt { color: var(--muted); font-weight: 400; font-size: 0.85em; }\n.intro { font-size: 1.02rem; }\n.points { padding-left: 1.1rem; }\n.points li { margin-bottom: 0.4rem; }\n\n/* Résultat : annuaire permanent (sensibilisation) */\n.bloc-ressources { margin-top: 0.2rem; }\n.bloc-ressources .ressources { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }\n.bloc-ressources .ressource-item { margin-bottom: 0; }\n\n/* Résultat : communications à diffuser (contextuelles) */\n.bloc-coms { margin-top: 0.2rem; }\n.affichages-intro { margin: 0 0 0.5rem; font-size: 0.88rem; color: var(--muted); }\n.affichages-theme { margin: 0.7rem 0 0.2rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }\n.affichages-liste { margin: 0 0 0.6rem; padding-left: 1.1rem; }\n.affichages-liste li { margin-bottom: 0.3rem; }\n.affichages-liste a { overflow-wrap: anywhere; }\n\n/* Légende familles */\n.legende { display: inline-flex; flex-wrap: wrap; gap: 0.1rem 0.8rem; }\n.leg-item { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }\n\n/* ---------- Étape signaux : colonnes par famille ---------- */\n.grille-familles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }\n.famille-col { border-top: 3px solid var(--fc); padding-top: 0.6rem; }\n.famille-titre { font-size: 0.86rem; font-weight: 700; margin: 0 0 0.5rem; display: flex; align-items: center; gap: 0.35rem; }\n.famille-col .chip { display: block; width: 100%; text-align: left; margin-bottom: 0.4rem; }\n.famille-col .chip.actif { border-color: var(--fc); background: color-mix(in srgb, var(--fc) 12%, #fff); }\n\n/* ---------- Chips (toggles) ---------- */\n.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }\n.chip {\n  font: inherit; font-size: 0.9rem; cursor: pointer;\n  border: 1px solid var(--border); background: #fff; color: var(--text);\n  border-radius: 999px; padding: 0.45rem 0.8rem; transition: border-color .12s, background .12s;\n}\n.chip:hover { border-color: #b9c6bf; }\n.chip.actif { border-color: var(--primary); background: var(--accent-soft); font-weight: 600; }\n.chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n\n/* ---------- Temporalité (segmenté) ---------- */\n.bloc-temporalite { margin-bottom: 1.1rem; }\n.segmente { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }\n.seg { font: inherit; cursor: pointer; text-align: left; border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; gap: 0.1rem; }\n.seg .seg-titre { font-weight: 700; }\n.seg .seg-aide { font-size: 0.8rem; color: var(--muted); }\n.seg.actif { border-color: var(--primary); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--primary); }\n.seg:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n\n/* ---------- Résultat ---------- */\n.bandeau-niveau { border-radius: var(--radius); padding: 0.9rem 1.1rem; color: #fff; }\n.bandeau-niveau .niv-id { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }\n.bandeau-niveau .niv-libelle { font-size: 1.45rem; font-weight: 800; margin: 0.05rem 0 0.2rem; }\n.bandeau-niveau .niv-resume { margin: 0; font-size: 0.96rem; }\n\n.lecture { color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0 0.9rem; }\n\n.resultat-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }\n.carte { border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 0.95rem; margin-bottom: 0.9rem; background: #fff; }\n.carte:last-child { margin-bottom: 0; }\n.carte h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }\n.carte-eviter { background: #fff7ed; border-color: #f3d9b8; }\n.posture { margin: 0; background: var(--accent-soft); border-left: 4px solid var(--primary); padding: 0.55rem 0.7rem; border-radius: 6px; }\n.demarche { margin: 0; padding-left: 1.1rem; }\n.demarche li { margin-bottom: 0.4rem; }\n.demarche li:last-child { margin-bottom: 0; }\n.liste-puces { margin: 0; padding-left: 1.1rem; }\n.liste-puces li { margin-bottom: 0.35rem; }\n.ressources { list-style: none; padding: 0; margin: 0; }\n.ressource-item { display: block; padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.4rem; background: #fafbfc; overflow-wrap: anywhere; }\n.ressource-nom { display: block; font-weight: 600; font-size: 0.92rem; }\n.ressource-role { display: block; font-size: 0.82rem; color: var(--muted); margin-top: 0.15rem; line-height: 1.35; }\n.ressource-contact { display: block; font-size: 0.82rem; margin-top: 0.25rem; font-weight: 600; overflow-wrap: anywhere; }\n.ressource-contact a { font-weight: 500; }\n.detail-ressource { margin-top: 0.3rem !important; font-size: 0.85rem; color: var(--muted); }\n.appui-note { margin: 0.5rem 0 0; font-size: 0.83rem; color: var(--muted); font-style: italic; }\n\n/* Détail par item (visible) */\n.bloc-detail { margin-top: 0.2rem; }\n.detail-soustitre { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0.9rem 0 0.3rem; }\n.detail-item { padding: 0.55rem 0; border-top: 1px solid var(--border); }\n.detail-item:first-child { border-top: none; padding-top: 0.2rem; }\n.detail-item-titre { font-weight: 600; margin: 0 0 0.2rem; }\n.detail-item p { margin: 0; }\n.tag-niveau {\n  display: inline-block; vertical-align: 1px;\n  color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em;\n  padding: 0.1rem 0.5rem; border-radius: 999px; margin-right: 0.15rem;\n}\n\n/* ---------- Navigation ---------- */\n.nav { display: flex; align-items: center; gap: 0.7rem; margin-top: 1rem; }\n.nav-spacer { flex: 1; }\n.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 0.65rem 1.3rem; cursor: pointer; border: 1px solid transparent; }\n.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n.btn-primary { background: var(--primary); color: #fff; }\n.btn-primary:hover { background: var(--primary-dark); }\n.btn-ghost { background: #fff; color: var(--primary); border-color: var(--border); }\n.btn-ghost:hover { background: #eef1f5; }\n\n.prudence { color: var(--muted); font-size: 0.82rem; background: #fff7ed; border: 1px solid #f3d9b8; border-radius: 8px; padding: 0.7rem 0.9rem; margin-top: 1rem; }\n\n.site-footer { padding: 1rem 0; color: var(--muted); font-size: 0.82rem; text-align: center; border-top: 1px solid var(--border); }\n\n/* ---------- Responsive ---------- */\n@media (max-width: 760px) {\n  .grille-familles { grid-template-columns: 1fr; gap: 0.7rem; }\n  .resultat-cols { grid-template-columns: 1fr; }\n  .segmente { grid-template-columns: 1fr; }\n  .bloc-ressources .ressources { grid-template-columns: 1fr; }\n  .steps { display: none; }\n}\n","js":"/* Matrice de criticité — logique côté navigateur.\n * Approche par item : chaque signal porte sa propre criticité et son conseil.\n * Le niveau d'ensemble = le signal le plus sérieux coché (aucune pondération).\n * Aucune donnée n'est stockée ni transmise : tout vit dans cette page. */\n\n(function () {\n  \"use strict\";\n\n  var data = null;\n  var etat = { signaux: {}, contexte: {} };\n  var STEPS = [\"accueil\", \"signaux\", \"contexte\", \"resultat\"];\n  var step = 0;\n\n  function $(s) { return document.querySelector(s); }\n  function el(t, c) { var n = document.createElement(t); if (c) n.className = c; return n; }\n\n  // Lien vers une affiche : soit un document EMBARQUÉ (importé dans le Studio,\n  // champ `fichier_data` en data URI), soit un CHEMIN vers un fichier du site.\n  // Les data URI ne peuvent pas s'ouvrir directement dans un onglet (bloqué par\n  // les navigateurs) : on passe par un Blob (autorisé), créé une seule fois par item.\n  var _blobCache = (typeof WeakMap !== \"undefined\") ? new WeakMap() : null;\n  function afficheHref(it) {\n    if (it.fichier_data) {\n      if (_blobCache && _blobCache.has(it)) return _blobCache.get(it);\n      try {\n        var url = URL.createObjectURL(dataURIversBlob(it.fichier_data));\n        if (_blobCache) _blobCache.set(it, url);\n        return url;\n      } catch (e) { return it.fichier || \"#\"; }\n    }\n    return it.fichier;\n  }\n  function dataURIversBlob(dataURI) {\n    var virgule = dataURI.indexOf(\",\");\n    var meta = dataURI.slice(0, virgule), b64 = dataURI.slice(virgule + 1);\n    var mime = (meta.match(/data:([^;]+)/) || [])[1] || \"application/octet-stream\";\n    var bin = atob(b64), n = bin.length, arr = new Uint8Array(n);\n    for (var i = 0; i \u003c n; i++) arr[i] = bin.charCodeAt(i);\n    return new Blob([arr], { type: mime });\n  }\n\n  // Résolution du contenu, dans l'ordre :\n  //  1) contenu embarqué dans la page (window.__CONTENU__) → page publiée par le\n  //     Studio ou prévisualisation : aucun accès réseau, fonctionne même en file://.\n  //  2) sinon, chargement du fichier de données (mode dépôt / développement).\n  function chargerContenu() {\n    if (window.__CONTENU__) return Promise.resolve(window.__CONTENU__);\n    return fetch(\"data/contenu.json\", { cache: \"no-store\" })\n      .then(function (r) { if (!r.ok) throw new Error(\"HTTP \" + r.status); return r.json(); });\n  }\n\n  chargerContenu()\n    .then(function (json) { data = json; init(); })\n    .catch(function (err) {\n      if (window.console && console.error) console.error(\"Chargement du contenu impossible :\", err);\n      $(\"#app\").innerHTML =\n        '\u003csection class=\"step\" role=\"alert\" tabindex=\"-1\" id=\"erreur-chargement\">' +\n        \"\u003ch2>Chargement impossible\u003c/h2>\u003cp>Le contenu n'a pas pu être chargé. Réessayez plus tard ou \" +\n        'signalez-le au support.\u003c/p>\u003cp class=\"opt\">En local, lancez un petit serveur (voir le README).\u003c/p>\u003c/section>';\n      var box = $(\"#erreur-chargement\"); if (box) box.focus();\n    });\n\n  function init() {\n    var m = data.meta;\n    $(\"#app-titre\").textContent = m.titre;\n    document.title = m.titre + \" — Aide au manager\";\n    $(\"#app-sous-titre\").textContent = m.sous_titre || \"\";\n    $(\"#prudence\").textContent = m.prudence || \"\";\n\n    $(\"#accueil-intro\").textContent = m.accueil.intro;\n    var ul = $(\"#accueil-points\");\n    (m.accueil.points || []).forEach(function (p) { var li = el(\"li\"); li.textContent = p; ul.appendChild(li); });\n\n    var leg = $(\"#legende\");\n    Object.keys(m.familles).forEach(function (k) {\n      var f = m.familles[k];\n      var s = el(\"span\", \"leg-item\");\n      s.textContent = f.puce + \" \" + f.libelle;\n      leg.appendChild(s);\n    });\n\n    rendreSignaux();\n    rendreContexte();\n    brancher();\n    aller(0);\n  }\n\n  /* ---------- Étape signaux : colonnes par famille ---------- */\n  function rendreSignaux() {\n    var cont = $(\"#grille-signaux\");\n    cont.innerHTML = \"\";\n    Object.keys(data.meta.familles).forEach(function (fid) {\n      var f = data.meta.familles[fid];\n      var sigs = data.signaux.filter(function (s) { return s.famille === fid; });\n      if (!sigs.length) return;\n      var col = el(\"div\", \"famille-col\");\n      col.style.setProperty(\"--fc\", f.couleur);\n      col.setAttribute(\"role\", \"group\");\n      col.setAttribute(\"aria-labelledby\", \"fam-\" + fid);\n      var h = el(\"p\", \"famille-titre\");\n      h.id = \"fam-\" + fid;\n      h.innerHTML = '\u003cspan class=\"puce\">' + f.puce + \"\u003c/span> \" + f.libelle;\n      col.appendChild(h);\n      sigs.forEach(function (s) { col.appendChild(chip(s, \"signaux\")); });\n      cont.appendChild(col);\n    });\n  }\n\n  function rendreContexte() {\n    var cont = $(\"#grille-contexte\");\n    cont.innerHTML = \"\";\n    data.contexte.forEach(function (c) { cont.appendChild(chip(c, \"contexte\")); });\n  }\n\n  function chip(item, type) {\n    var b = el(\"button\", \"chip\");\n    b.type = \"button\";\n    b.dataset.id = item.id;\n    b.setAttribute(\"aria-pressed\", \"false\");\n    b.textContent = item.libelle;\n    b.addEventListener(\"click\", function () {\n      var on = !etat[type][item.id];\n      etat[type][item.id] = on;\n      b.classList.toggle(\"actif\", on);\n      b.setAttribute(\"aria-pressed\", on ? \"true\" : \"false\");\n    });\n    return b;\n  }\n\n  /* ---------- Navigation ---------- */\n  function brancher() {\n    $(\"#btn-suivant\").addEventListener(\"click\", function () {\n      if (step \u003c STEPS.length - 1) {\n        if (STEPS[step + 1] === \"resultat\") rendreResultat();\n        aller(step + 1);\n      } else { recommencer(); }\n    });\n    $(\"#btn-retour\").addEventListener(\"click\", function () { if (step > 0) aller(step - 1); });\n  }\n\n  function aller(i) {\n    step = i;\n    STEPS.forEach(function (name, idx) { $(\"#step-\" + name).hidden = idx !== i; });\n    $(\"#steps\").querySelectorAll(\"li\").forEach(function (li) {\n      var n = parseInt(li.dataset.step, 10);\n      li.classList.toggle(\"actif\", n === i);\n      li.classList.toggle(\"fait\", n \u003c i);\n    });\n    var suivant = $(\"#btn-suivant\");\n    $(\"#btn-retour\").hidden = (i === 0);\n    if (i === 0) suivant.textContent = \"Commencer\";\n    else if (STEPS[i] === \"contexte\") suivant.textContent = \"Voir le résultat\";\n    else if (STEPS[i] === \"resultat\") suivant.textContent = \"Nouvelle situation\";\n    else suivant.textContent = \"Suivant →\";\n\n    // a11y : repère d'étape pour lecteurs d'écran + focus sur la tête de l'étape\n    // (annonce le contenu révélé, dont le bandeau role=status du résultat).\n    majCompteurEtape(i);\n    var cible = (STEPS[i] === \"resultat\") ? $(\"#bandeau-niveau\") : $(\"#step-\" + STEPS[i] + \" h2\");\n    if (cible) { cible.setAttribute(\"tabindex\", \"-1\"); cible.focus({ preventScroll: true }); }\n    window.scrollTo({ top: 0, behavior: \"smooth\" });\n  }\n\n  /* Compteur d'étape (visible des seuls lecteurs d'écran). */\n  function majCompteurEtape(i) {\n    var prev = document.querySelector(\".sr-step-count\");\n    if (prev && prev.parentNode) prev.parentNode.removeChild(prev);\n    if (i \u003c 1) return; // accueil : pas de compteur\n    var h = $(\"#step-\" + STEPS[i] + \" h2\");\n    if (!h) return;\n    var s = el(\"span\", \"sr-only sr-step-count\");\n    s.textContent = \" (étape \" + i + \" sur \" + (STEPS.length - 1) + \")\";\n    h.appendChild(s);\n  }\n\n  function recommencer() {\n    etat = { signaux: {}, contexte: {} };\n    document.querySelectorAll(\".chip.actif\").forEach(function (c) {\n      c.classList.remove(\"actif\"); c.setAttribute(\"aria-pressed\", \"false\");\n    });\n    aller(1);\n  }\n\n  /* ---------- Sélections ---------- */\n  function selSignaux() { return data.signaux.filter(function (s) { return etat.signaux[s.id]; }); }\n  function selContexte() { return data.contexte.filter(function (c) { return etat.contexte[c.id]; }); }\n  function niv(id) { return data.niveaux.filter(function (n) { return n.id === id; })[0]; }\n\n  /* ---------- Évaluation : le plus sérieux signal coché ---------- */\n  function evaluer() {\n    var sig = selSignaux();\n    var ctx = selContexte();\n    if (!sig.length) return { niveau: niv(\"N0\"), sig: sig, ctx: ctx };\n    var maxRang = 0;\n    sig.forEach(function (s) { var r = niv(s.niveau).rang; if (r > maxRang) maxRang = r; });\n    return { niveau: data.niveaux.filter(function (n) { return n.rang === maxRang; })[0], sig: sig, ctx: ctx };\n  }\n\n  /* ---------- Restitution ---------- */\n  function rendreResultat() {\n    var res = evaluer();\n    var n = res.niveau;\n\n    var bandeau = $(\"#bandeau-niveau\");\n    bandeau.style.background = n.couleur;\n    bandeau.innerHTML =\n      '\u003cdiv class=\"niv-id\">Niveau de criticité ' + n.id + \"\u003c/div>\" +\n      '\u003cdiv class=\"niv-libelle\">' + n.libelle + \"\u003c/div>\" +\n      '\u003cp class=\"niv-resume\">' + n.resume + \"\u003c/p>\";\n\n    var lecture = $(\"#lecture\");\n    if (res.sig.length) {\n      lecture.hidden = false;\n      lecture.textContent = res.sig.length + (res.sig.length > 1 ? \" signaux cochés\" : \" signal coché\") +\n        (res.ctx.length ? \" · \" + res.ctx.length + \" élément\" + (res.ctx.length > 1 ? \"s\" : \"\") + \" de contexte\" : \"\") +\n        \" — la conduite est donnée par le signal le plus sérieux.\";\n    } else { lecture.hidden = true; }\n\n    var cols = $(\".resultat-cols\");\n    var bloc = $(\".bloc-detail\");\n    var afficher = (n.id !== \"N0\");\n    cols.style.display = afficher ? \"\" : \"none\";\n    bloc.style.display = afficher ? \"\" : \"none\";\n\n    if (afficher) {\n      $(\"#posture\").textContent = n.posture;\n      remplirListe($(\"#demarche\"), n.demarche);\n      remplirListe($(\"#a-eviter\"), data.meta.a_eviter);\n      rendreRessources($(\"#ressources\"), n.ressources);\n      $(\"#appui-note\").textContent = data.meta.appui_note || \"\";\n      rendreDetail(res);\n    }\n    // Les communications sont contextuelles : elles peuvent dépendre d'un\n    // contexte coché seul (donc même en N0). rendreAffichages gère son propre\n    // état d'affichage selon les ressources actives.\n    rendreAffichages(res, n);\n    // Annuaire permanent (sensibilisation) : toujours affiché.\n    rendreRessourcesUtiles();\n  }\n\n  /* Annuaire permanent des dispositifs, en fin de résultat (communiquer / sensibiliser). */\n  function rendreRessourcesUtiles() {\n    var box = $(\"#ressources-utiles\");\n    var ru = data.meta.ressources_utiles;\n    if (!ru || !ru.ids || !ru.ids.length) { box.hidden = true; return; }\n    box.hidden = false;\n    $(\"#ressources-utiles-titre\").textContent = ru.titre || \"Ressources utiles\";\n    $(\"#ressources-utiles-intro\").textContent = ru.intro || \"\";\n    rendreRessources($(\"#ressources-utiles-liste\"), ru.ids);\n  }\n\n  /* ---------- Résultat : communications à diffuser, filtrées sur la situation ---------- */\n  function rendreAffichages(res, n) {\n    var box = $(\"#affichages\");\n    var aff = data.meta.affichages;\n    if (!aff || !aff.items) { box.hidden = true; return; }\n\n    // Ressources « actives » = celles du niveau + celles des contextes cochés\n    var actives = {};\n    (n.ressources || []).forEach(function (r) { actives[r] = true; });\n    res.ctx.forEach(function (c) { if (c.ressource) actives[c.ressource] = true; });\n\n    var items = aff.items.filter(function (it) {\n      return (it.ressources || []).some(function (r) { return actives[r]; });\n    });\n    if (!items.length) { box.hidden = true; return; }\n\n    box.hidden = false;\n    $(\"#affichages-titre\").textContent = aff.titre || \"Communications à diffuser\";\n    $(\"#affichages-intro\").textContent = aff.intro || \"\";\n\n    var cont = $(\"#affichages-themes\");\n    cont.innerHTML = \"\";\n    var themes = [];\n    items.forEach(function (it) {\n      var t = it.theme || \"\";\n      var grp = themes.filter(function (g) { return g.titre === t; })[0];\n      if (!grp) { grp = { titre: t, items: [] }; themes.push(grp); }\n      grp.items.push(it);\n    });\n    themes.forEach(function (g) {\n      if (g.titre) { var h = el(\"p\", \"affichages-theme\"); h.textContent = g.titre; cont.appendChild(h); }\n      var ul = el(\"ul\", \"affichages-liste\");\n      g.items.forEach(function (it) {\n        var li = el(\"li\");\n        var a = el(\"a\"); a.href = afficheHref(it); a.target = \"_blank\"; a.rel = \"noopener\";\n        a.textContent = it.titre;\n        var hint = el(\"span\", \"sr-only\"); hint.textContent = \" (PDF, nouvel onglet)\";\n        a.appendChild(hint);\n        li.appendChild(a);\n        ul.appendChild(li);\n      });\n      cont.appendChild(ul);\n    });\n  }\n\n  function remplirListe(node, items) {\n    node.innerHTML = \"\";\n    (items || []).forEach(function (t) { var li = el(\"li\"); li.textContent = t; node.appendChild(li); });\n  }\n\n  /* Catalogue des dispositifs internes (meta.ressources). */\n  function ressource(id) { return (data.meta.ressources || {})[id] || null; }\n\n  /* Rend la liste « Vers qui orienter » en cartes (libellé + rôle + contact/lien). */\n  function rendreRessources(node, ids) {\n    node.innerHTML = \"\";\n    (ids || []).forEach(function (id) {\n      var r = ressource(id);\n      var li = el(\"li\", \"ressource-item\");\n      if (!r) { li.textContent = id; node.appendChild(li); return; } // tolérance : ancien libellé brut\n      var nom = el(\"span\", \"ressource-nom\"); nom.textContent = r.libelle;\n      li.appendChild(nom);\n      if (r.role) { var role = el(\"span\", \"ressource-role\"); role.textContent = r.role; li.appendChild(role); }\n      var coord = ligneContact(r);\n      if (coord) li.appendChild(coord);\n      node.appendChild(li);\n    });\n  }\n\n  /* Ligne contact + lien, affichée seulement si renseignée. */\n  function ligneContact(r) {\n    if (!r.contact && !r.lien) return null;\n    var c = el(\"span\", \"ressource-contact\");\n    if (r.contact) c.appendChild(document.createTextNode(r.contact));\n    if (r.lien) {\n      if (r.contact) c.appendChild(document.createTextNode(\" · \"));\n      var a = el(\"a\"); a.href = r.lien; a.target = \"_blank\"; a.rel = \"noopener\";\n      a.textContent = \"en savoir plus\";\n      var hint = el(\"span\", \"sr-only\"); hint.textContent = \" (\" + r.libelle + \", nouvel onglet)\";\n      a.appendChild(hint);\n      c.appendChild(a);\n    }\n    return c;\n  }\n\n  function rendreDetail(res) {\n    var box = $(\"#detail-contenu\");\n    box.innerHTML = \"\";\n\n    if (res.sig.length) {\n      // Signaux triés du plus sérieux au moins sérieux\n      var sig = res.sig.slice().sort(function (a, b) { return niv(b.niveau).rang - niv(a.niveau).rang; });\n      sig.forEach(function (s) {\n        var nv = niv(s.niveau);\n        var item = el(\"div\", \"detail-item\");\n        var titre = el(\"p\", \"detail-item-titre\");\n        var tag = el(\"span\", \"tag-niveau\");\n        tag.style.background = nv.couleur;\n        tag.textContent = nv.libelle;\n        titre.appendChild(tag);\n        titre.appendChild(document.createTextNode(\" \" + s.libelle));\n        var p = el(\"p\"); p.textContent = s.conseil;\n        item.appendChild(titre); item.appendChild(p);\n        box.appendChild(item);\n      });\n    }\n\n    if (res.ctx.length) r (MAJ 2025)","fichier":"assets/affichages/incivilites-agence.pdf","theme":"Incivilités","ressources":["process_incivilite"]},{"titre":"Incivilités au téléphone — conduite à tenir (MAJ 2025)","fichier":"assets/affichages/incivilites-telephone.pdf","theme":"Incivilités","ressources":["process_incivilite"]},{"titre":"Affiche incivilités — à destination des sociétaires","fichier":"assets/affichages/incivilites-societaires.pdf","theme":"Incivilités","ressources":["process_incivilite"]},{"titre":"Affichage AS-HS 2026 — harcèlement / agissements sexistes","fichier":"assets/affichages/affichage-as-hs-2026.pdf","theme":"Harcèlement / agissements sexistes","ressources":["referent_harcelement"]}]},"ressources_utiles":{"titre":"Ressources utiles — à connaître et à diffuser","intro":"Les dispositifs Groupama d'Oc à garder en tête et à faire connaître à vos équipes, quel que soit le niveau.","ids":["cellule_cela","referent_rps","medecine_travail","rh_proximite","proche_aidant","process_incivilite","referent_harcelement","alerte_drh","secours"]},"familles":{"sante":{"libelle":"Souffrance / santé","puce":"🔴","couleur":"#c53030"},"relationnel":{"libelle":"Relationnel / comportement","puce":"🟠","couleur":"#c05621"},"performance":{"libelle":"Performance / engagement","puce":"🟡","couleur":"#8a5a12"}},"a_eviter":["Interroger les raisons médicales ou poser un diagnostic — ce n'est pas votre rôle.","Réagir à chaud, ou aborder le sujet en public.","Foncer sur des solutions avant d'avoir vraiment écouté.","Minimiser (« ça va passer ») comme dramatiser.","Rester seul avec la situation — ou, à l'inverse, vous substituer aux professionnels.","Basculer sur le disciplinaire quand un signal de souffrance est présent."],"ressources":{"rh_proximite":{"libelle":"RH de proximité","role":"Votre interlocuteur RH habituel. À associer dès qu'une situation se formalise, se répète ou demande un cadre (suivi, organisation, droits).","contact":"Coll'OC › Espace RH","lien":""},"referent_rps":{"libelle":"Référent RPS / Qualité de Vie au Travail","role":"Conseil et appui sur les situations de souffrance ou de tension liées au travail.","contact":"Coll'OC › Espace RH › Ma Qualité de Vie au Travail","lien":""},"medecine_travail":{"libelle":"Médecine du travail (MSA)","role":"Service de santé au travail de la MSA. À solliciter face à la fatigue, aux plaintes somatiques ou à un mal-être ; seule habilitée sur le volet médical. La DRH peut déclencher une visite.","contact":"Coordonnées via Coll'OC › Espace RH › Affichage réglementaire","lien":""},"cellule_cela":{"libelle":"Cellule d'écoute Céla (Qualisocial)","role":"Écoute psychologique anonyme, confidentielle et gratuite, 24h/24 et 7j/7, pour le collaborateur — et conseil au manager face à un collaborateur sensible.","contact":"0 805 389 958 (gratuit) · service-ecoute@qualisocial.com","lien":""},"proche_aidant":{"libelle":"Soutien proche-aidant (Céla)","role":"Quand la vie personnelle (aider un proche) pèse sur le travail : le volet social et familial de Céla accompagne (aidant, démarches, écoute).","contact":"0 805 389 958 (gratuit) · service-ecoute@qualisocial.com","lien":""},"process_incivilite":{"libelle":"Process incivilité","role":"Incivilité client ou interne : prévenez votre N+1 (et N+2 selon gravité), tracez l'incident, et activez la procédure d'alerte DRH. Selon la gravité : dépôt de plainte accompagné par le RCS. Pour le harcèlement / les agissements sexistes, un référent dédié est identifié sur Coll'OC.","contact":"Base Incidents (ServiceNow) · alerte DRH : alerte-oc@groupama-oc.fr","lien":"https://groupama.service-now.com/services_portal_groupama"},"alerte_drh":{"libelle":"Procédure d'alerte DRH","role":"Signaler à la DRH une situation grave (souffrance installée, incivilité, harcèlement). La DRH oriente, traite les cas particuliers et peut déclencher une visite auprès de la médecine du travail.","contact":"alerte-oc@groupama-oc.fr","lien":""},"referent_harcelement":{"libelle":"Référent harcèlement sexuel / agissements sexistes","role":"Oriente, informe et accompagne face au harcèlement sexuel et aux agissements sexistes ; peut enclencher les procédures destinées à faire cesser les agissements.","contact":"Margot MORU (RH) : 05 62 47 35 28 · Sylvie EYCHENNE (CSE) : sylvie.eychenne@groupama-oc.fr","lien":""},"eae":{"libelle":"Entretien Annuel d'Évaluation (EAE)","role":"Temps d'échange annuel pour faire le point et ouvrir des perspectives (mobilité, évolution, formation). Un bilan RH peut le compléter.","contact":"","lien":""},"secours":{"libelle":"Secours — danger immédiat","role":"Propos suicidaires, détresse aiguë, atteinte physique : alertez sans attendre et restez auprès de la personne.","contact":"15 (SAMU) · 18 (pompiers) · 17 (police) · 112","lien":""}}},"niveaux":[{"id":"N0","rang":0,"libelle":"Aucun signal","couleur":"#6b7280","resume":"Aucun signal n'a été coché. Si une inquiétude diffuse persiste, sélectionnez ce que vous observez.","posture":"","demarche":[],"ressources":[]},{"id":"N1","rang":1,"libelle":"Vigilance","couleur":"#2f855a","resume":"À surveiller. Rien d'alarmant — restez attentif et disponible.","posture":"Observer et rester disponible, sans dramatiser.","demarche":["Gardez ces signaux en tête sans en faire une affaire ; isolés, ils appellent de l'attention, pas une réaction.","Prenez des nouvelles à l'occasion, simplement, au fil d'un échange informel.","Soyez attentif à ce qui se répète ou s'aggrave : c'est ce qui changerait la donne."],"ressources":["rh_proximite"]},{"id":"N2","rang":2,"libelle":"Attention","couleur":"#8a5a12","resume":"Le moment d'ouvrir le dialogue, sans laisser traîner.","posture":"Ouvrir le dialogue tôt, écouter avant de vouloir résoudre.","demarche":["Provoquez un échange en tête-à-tête, au calme et au bon moment (pas à chaud, pas en public).","Ouvrez sur du factuel et de l'ouvert : « j'ai remarqué…, comment ça va de ton côté ? », puis écoutez sans meubler.","Cherchez ensemble ce qui, dans le travail, peut être ajusté, et reconvenez d'un point de suivi rapproché."],"ressources":["rh_proximite","referent_rps"]},{"id":"N3","rang":3,"libelle":"Situation sérieuse","couleur":"#c05621","resume":"Situation à prendre au sérieux : prenez les choses en main et ne restez pas seul.","posture":"Structurer un suivi, agir sur le travail, et ne pas rester seul.","demarche":["Formalisez l'échange : nommez la situation sans la dramatiser et co-construisez un plan avec des points réguliers.","Ne portez pas seul : associez les RH, et le référent RPS selon le cas.","Agissez sur ce qui pèse dans votre périmètre : alléger, réorganiser, clarifier."],"ressources":["rh_proximite","referent_rps","medecine_travail","cellule_cela"]},{"id":"N4","rang":4,"libelle":"Alerte","couleur":"#c53030","resume":"Signal de danger. Priorité à la protection de la personne.","posture":"Protéger et orienter sans délai — relayer, pas porter seul.","demarche":["Orientez sans attendre vers le soutien adapté (référent RPS, médecine du travail, cellule d'écoute Céla) : proposez, n'imposez pas.","Assurez une présence bienveillante : gardez le lien, ne laissez pas la personne isolée.","Informez les RH. Danger immédiat (propos suicidaires, détresse aiguë) : appelez le 15 et restez auprès d'elle."],"ressources":["secours","cellule_cela","medecine_travail","alerte_drh","referent_rps","rh_proximite"]}],"signaux":[{"id":"propos_inquietants","libelle":"Propos inquiétants / désespoir","famille":"sante","niveau":"N4","conseil":"Urgence : ne laissez pas la personne seule. Orientez tout de suite vers la médecine du travail ou la cellule d'écoute ; danger imminent, appelez le 15. Votre rôle n'est pas de gérer seul, mais de protéger et de relayer."},{"id":"mal_etre_exprime","libelle":"Mal-être exprimé ouvertement","famille":"sante","niveau":"N3","conseil":"C'est d'abord à vous d'ouvrir le dialogue : accueillez la parole sans la juger ni vouloir la régler sur le champ. Orientez vers le soutien (référent RPS, médecine du travail, Céla) si le mal-être est profond ou persistant, et informez les RH."},{"id":"changement_comportement","libelle":"Changement de comportement","famille":"sante","niveau":"N3","conseil":"Fiez-vous au contraste avec son fonctionnement habituel. Dites ce que vous observez, factuellement, et ouvrez la porte sans forcer : « je te sens différent ces derniers temps »."},{"id":"isolement","libelle":"Isolement / repli","famille":"sante","niveau":"N2","conseil":"Recréez du lien plutôt que de pointer le retrait : sollicitations simples, place dans le collectif. Cherchez si c'est subi (mise à l'écart) ou choisi (protection)."},{"id":"irritabilite","libelle":"Irritabilité","famille":"sante","niveau":"N2","conseil":"Ne le prenez pas personnellement et n'y répondez pas à chaud. À froid, explorez ce qui pèse (charge, tensions, hors-travail) sans le présumer."},{"id":"pleurs_emotivite","libelle":"Pleurs / émotivité inhabituelle","famille":"sante","niveau":"N2","conseil":"Laissez de la place à l'émotion sans la commenter ni la fuir. Un mot simple, un temps au calme : c'est souvent le signe d'un trop-plein."},{"id":"plaintes_somatiques","libelle":"Plaintes somatiques / fatigue visible","famille":"sante","niveau":"N2","conseil":"Prenez la fatigue au sérieux comme signal, sans jamais entrer dans le médical. Voyez ce qui peut être allégé et orientez vers la médecine du travail."},{"id":"esprit_negatif","libelle":"Esprit négatif","famille":"sante","niveau":"N2","conseil":"Avant de vouloir « remotiver », écoutez ce qui nourrit ce regard (sens, reconnaissance, tensions). La négativité est souvent un symptôme, pas un trait de caractère."},{"id":"conflits_interpersonnels","libelle":"Conflits interpersonnels","famille":"relationnel","niveau":"N2","conseil":"Intervenez tôt : un conflit qui s'installe contamine l'équipe. Recevez les versions séparément, restez sur les faits et les besoins, puis posez un cadre commun."},{"id":"comportements_negatifs","libelle":"Comportements négatifs","famille":"relationnel","niveau":"N2","conseil":"Tenez le cadre sur les comportements (ce qui est acceptable) sans condamner la personne. Cherchez la cause : frustration, sentiment d'injustice, fatigue."},{"id":"surinvestissement","libelle":"Surinvestissement / hyperprésentéisme","famille":"performance","niveau":"N2","conseil":"Ne confondez pas engagement et alerte : l'incapacité à décrocher use. Posez des limites visibles et valorisez l'efficacité plutôt que le temps passé."},{"id":"desengagement","libelle":"Désengagement","famille":"performance","niveau":"N2","conseil":"Ne forcez pas l'implication : rouvrez le sens, la reconnaissance et l'écoute avant de parler résultats. Le désengagement est une conséquence, pas une cause."},{"id":"absenteisme","libelle":"Absentéisme","famille":"performance","niveau":"N1","conseil":"Ne questionnez jamais le motif médical. Soignez le retour (point de reprise, mise à jour) ; si les absences se répètent, regardez le travail et associez les RH."},{"id":"baisse_performances","libelle":"Baisse des performances","famille":"performance","niveau":"N1","conseil":"Traitez-la comme un symptôme à comprendre, pas comme une faute à sanctionner. Cherchez la cause (charge, sens, santé, compétence) avant d'ajuster les attentes."},{"id":"non_respect_delais","libelle":"Non-respect des délais","famille":"performance","niveau":"N1","conseil":"Cherchez le « pourquoi » (surcharge, priorités floues, décrochage) avant de recadrer. Clarifiez ensemble priorités et points de passage."},{"id":"erreurs_pro","libelle":"Erreurs professionnelles","famille":"performance","niveau":"N1","conseil":"Reprenez les faits avec pédagogie, sans dramatiser ni humilier. Vérifiez charge et concentration : des erreurs qui se multiplient sont rarement un simple manque de soin."},{"id":"inattention","libelle":"Inattention","famille":"performance","niveau":"N1","conseil":"Distinguez l'écart ponctuel du décrochage installé. Souvent liée à la fatigue ou à la surcharge mentale : reprioritisez et allégez le « bruit »."},{"id":"manque_autonomie","libelle":"Manque d'autonomie","famille":"performance","niveau":"N1","conseil":"Identifiez le frein réel : compétence, confiance, ou un cadre trop serré de votre part. Donnez de la marge par étapes, avec un droit à l'erreur."},{"id":"baisse_motivation","libelle":"Baisse de la motivation","famille":"performance","niveau":"N1","conseil":"Reconnectez à ce qui fait sens pour la personne (intérêts, perspectives) plutôt que de remobiliser par la pression. Une évolution des missions est parfois la clé."},{"id":"feedback_negatif","libelle":"Feedback négatif du collaborateur","famille":"performance","niveau":"N1","conseil":"Accueillez la critique sans vous justifier aussitôt ; reformulez pour montrer que vous avez entendu. Un feedback exprimé est une chance de régler avant que ça s'enkyste."}],"contexte":[{"id":"forte_charge","libelle":"Forte charge de travail","famille_gollac":"Intensité et temps de travail","conseil":"Agissez concrètement : repriorisez, redistribuez, allégez temporairement. Une charge forte n'use vraiment que si l'autonomie et le soutien manquent — donnez les deux."},{"id":"objectifs_performance","libelle":"Objectifs de performance (flous ou élevés)","famille_gollac":"Intensité et temps de travail","conseil":"Rendez l'attendu clair et atteignable. Des objectifs flous ou hors d'atteinte génèrent plus de stress que de performance."},{"id":"vie_pro_perso","libelle":"Vie pro qui empiète sur la vie perso","famille_gollac":"Intensité et temps de travail","conseil":"Ouvrez des marges sur l'organisation (priorisation, flexibilité, télétravail) plutôt que d'attendre que la personne « tienne »."},{"id":"incivilite_client","libelle":"Incivilité client récente","famille_gollac":"Exigences émotionnelles","conseil":"Soutenez et légitimez l'impact (« ce n'est pas normal d'avoir à subir ça »). Débriefez et activez le process de déclaration d'incivilité.","ressource":"process_incivilite"},{"id":"incivilite_interne","libelle":"Incivilité interne (d'un collègue)","famille_gollac":"Exigences émotionnelles","conseil":"Ne laissez rien passer entre collègues : posez le cadre et protégez la personne exposée. Tracez les faits et appuyez-vous sur le process interne.","ressource":"process_incivilite"},{"id":"harcelement_sexisme","libelle":"Harcèlement / agissements sexistes","famille_gollac":"Exigences émotionnelles","conseil":"Ne minimisez pas. Protégez la personne, tracez les faits et orientez sans tarder vers le référent dédié, qui peut enclencher les procédures destinées à faire cesser les agissements.","ressource":"referent_harcelement"},{"id":"evolution_poste","libelle":"Évolution dans le poste","famille_gollac":"Manque d'autonomie / marges de manœuvre","conseil":"Accompagnez la prise de poste : points rapprochés, objectifs ajustés, droit à la montée en compétence."},{"id":"evolution_taches","libelle":"Évolution dans les tâches","famille_gollac":"Manque d'autonomie / marges de manœuvre","conseil":"Vérifiez que la complexité est proportionnée et explicitée ; prévoyez un filet de soutien le temps de l'adaptation."},{"id":"faible_valorisation","libelle":"Faible valorisation / reconnaissance","famille_gollac":"Rapports sociaux dégradés","conseil":"Rendez la reconnaissance concrète et régulière, pas seulement à l'entretien annuel. Le manque de reconnaissance est un facteur de risque à part entière."},{"id":"distorsion_equipe","libelle":"Tensions dans l'équipe","famille_gollac":"Rapports sociaux dégradés","conseil":"Reposez un cadre de fonctionnement clair et traitez les tensions tôt ; au besoin, une régulation d'équipe."},{"id":"manque_soutien","libelle":"Manque de soutien hiérarchique","famille_gollac":"Rapports sociaux dégradés","conseil":"Soyez réellement disponible et explicite sur l'appui que vous apportez : un soutien perçu change tout."},{"id":"perte_sens","libelle":"Perte de sens / qualité empêchée","famille_gollac":"Conflits de valeurs","conseil":"Reconnectez le travail à ses finalités et levez ce qui empêche de « bien faire » — la qualité empêchée use en profondeur."},{"id":"reorganisation","libelle":"Réorganisation récente","famille_gollac":"Insécurité de la situation de travail","conseil":"Donnez un espace pour exprimer ce qui inquiète et expliquez le cap : l'incertitude non dite amplifie le stress."},{"id":"manque_perspective","libelle":"Manque de perspective d'évolution","famille_gollac":"Insécurité de la situation de travail","conseil":"Soyez transparent sur le réalisable et ouvrez des pistes concrètes (mobilité, projets, formation ; EAE, bilan RH).","ressource":"eae"},{"id":"reintegration_absence","libelle":"Réintégration après une absence","famille_gollac":"Insécurité de la situation de travail","conseil":"Préparez un retour structuré et progressif : un point d'accueil et l'appui de l'équipe évitent la rechute."},{"id":"vie_perso_pro","libelle":"Vie perso qui empiète sur la vie pro","famille_gollac":"Transverse","conseil":"Reconnaissez la situation sans intrusion, rappelez les ressources (ex. dispositif proche-aidant) et adaptez temporairement si possible.","ressource":"proche_aidant"}]}};</script>
